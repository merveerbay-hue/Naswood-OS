<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Critical first paint: never leave a black void while modules load (Cursor preview / dark color-scheme). -->
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #ffffff;
        color: #111827;
      }
      #root {
        min-height: 100vh;
      }
      #boot-splash {
        display: flex;
        min-height: 100vh;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 12px;
        font-family: system-ui, -apple-system, Segoe UI, sans-serif;
        background: #ffffff;
        color: #4b5563;
      }
      #boot-splash strong {
        color: #111827;
        font-size: 1.25rem;
      }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Naswood OS</title>
    <script>
      (function () {
        try {
          // Cursor / embedded previews often report prefers-color-scheme: dark.
          // Default to light for first paint so users don't see a black empty frame.
          var inFrame = false;
          try {
            inFrame = window.self !== window.top;
          } catch (e) {
            inFrame = true;
          }
          var stored = localStorage.getItem('naswood.theme');
          var pref = stored || (inFrame ? 'light' : 'system');
          var dark =
            pref === 'dark' ||
            (pref === 'system' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
          // Avoid documentElement.style.colorScheme before CSS — browser dark
          // color-scheme can paint a black blank page before React mounts.
          if (dark) {
            document.documentElement.style.background = '#0f172a';
            document.documentElement.style.color = '#f8fafc';
          } else {
            document.documentElement.style.background = '#ffffff';
            document.documentElement.style.color = '#111827';
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <div id="boot-splash">
        <strong>Naswood OS</strong>
        <span>Yükleniyor…</span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
